{% extends "base.html" %}

{% block title %}New report{% endblock %}

{% block content %}
<h1>New report</h1>

<form method="post" action="{{ url_for('new_report') }}" class="report-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ values.title }}"
               minlength="{{ limits.TITLE_MIN }}" maxlength="{{ limits.TITLE_MAX }}" required>
        {% if errors.title %}<p class="error">{{ errors.title }}</p>{% endif %}
    </div>

    <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="6"
                  minlength="{{ limits.DESCRIPTION_MIN }}" maxlength="{{ limits.DESCRIPTION_MAX }}" required>{{ values.description }}</textarea>
        {% if errors.description %}<p class="error">{{ errors.description }}</p>{% endif %}
    </div>

    <label class="toggle" id="preview-toggle" hidden>
        <input type="checkbox" id="preview-checkbox">
        Show preview
    </label>

    <button type="submit">Submit</button>
</form>

<section class="preview" id="preview" hidden>
    <h2>Preview</h2>
    <h3 id="preview-title"></h3>
    <p id="preview-description"></p>
</section>

<p><a href="{{ url_for('reports') }}">Back to list</a></p>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/preview.js') }}"></script>
{% endblock %}
